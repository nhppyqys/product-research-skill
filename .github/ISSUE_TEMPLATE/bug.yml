name: Bug
description: Something is broken in the scripts or the pack structure
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
    validations: { required: true }
  - type: input
    id: node
    attributes: { label: Node version }
