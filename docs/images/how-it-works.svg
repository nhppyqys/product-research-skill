<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#fbfaf8}.card{fill:#fff;stroke:#e0dbd2}
    .t{fill:#1f1d1a;font-size:13px;font-weight:600}
    .s{fill:#6b665e;font-size:11px}
    .n{fill:#8a857c;font-size:10px;font-weight:700;letter-spacing:.08em}
    .arrow{stroke:#c9c4bb;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .loop{stroke:#c0553f;stroke-width:1.5;fill:none;stroke-dasharray:4 3;marker-end:url(#r)}
    .gate{fill:#fdf6f4;stroke:#c0553f}
    .gt{fill:#a8452f;font-size:12px;font-weight:700}
    .out{fill:#f4f8f4;stroke:#7a9a7e}
    @media (prefers-color-scheme:dark){
      .bg{fill:#171614}.card{fill:#211f1c;stroke:#3a3630}
      .t{fill:#f0ede8}.s{fill:#a09a91}.n{fill:#7d776e}
      .arrow{stroke:#4a453e}.gate{fill:#2a1f1c;stroke:#c0553f}
      .out{fill:#1c2620;stroke:#7a9a7e}
    }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#c9c4bb"/></marker>
    <marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#c0553f"/></marker>
  </defs>
  <rect class="bg" width="880" height="470" rx="10"/>

  <text class="n" x="40" y="42">1 · GATHER</text>
  <rect class="card" x="40" y="54" width="230" height="118" rx="8"/>
  <text class="t" x="58" y="80">20 evidence steps</text>
  <text class="s" x="58" y="102">Site index before path guessing.</text>
  <text class="s" x="58" y="120">First-party pages before search.</text>
  <text class="s" x="58" y="138">Named competitors only if their</text>
  <text class="s" x="58" y="156">own site was opened.</text>

  <text class="n" x="325" y="42">2 · WRITE</text>
  <rect class="card" x="325" y="54" width="230" height="118" rx="8"/>
  <text class="t" x="343" y="80">17 fixed sections</text>
  <text class="s" x="343" y="102">Category, pricing, claims-vs-facts,</text>
  <text class="s" x="343" y="120">landscape, scale, customer voice,</text>
  <text class="s" x="343" y="138">risks, boundaries — every time,</text>
  <text class="s" x="343" y="156">in the same order.</text>

  <text class="n" x="610" y="42">3 · MEASURE</text>
  <rect class="gate" x="610" y="54" width="230" height="118" rx="8"/>
  <text class="gt" x="628" y="80">A check that can fail</text>
  <text class="s" x="628" y="102">Counts quotes, images, citations</text>
  <text class="s" x="628" y="120">per 1,000 characters, empty</text>
  <text class="s" x="628" y="138">sections, competitors that are</text>
  <text class="s" x="628" y="156">really the parent company.</text>

  <path class="arrow" d="M272,113 L322,113"/>
  <path class="arrow" d="M557,113 L607,113"/>
  <path class="loop" d="M725,174 L725,208 L155,208 L155,175"/>
  <text class="s" x="330" y="226" font-style="italic">below standard → back to gathering, with the gap named</text>

  <rect class="out" x="40" y="268" width="800" height="164" rx="8"/>
  <text class="t" x="62" y="296">What comes out</text>
  <text class="s" x="62" y="322">· Every number carries the page it came from — measured at 2–6 citations per 1,000 characters</text>
  <text class="s" x="62" y="344">· Product screenshots pulled from the vendor's own pages, placed beside the claim they show</text>
  <text class="s" x="62" y="366">· Vendor claims in a table with a verdict, including the ones arithmetic does not support</text>
  <text class="s" x="62" y="388">· Domain rank with its 30-day direction, and the caveat that a rank is not traffic</text>
  <text class="s" x="62" y="410">· A boundaries section naming what could not be obtained, and which channels were tried</text>
</svg>
